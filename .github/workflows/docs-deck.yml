# Copyright Daniel Grenemark 2026
#
# Rebuilds the committed deck export whenever the deck source changes.
#
# Only the HTML half is automated. The video under docs/deck/ is still captured
# by hand, because `open-slide video` is not in any published release of
# @open-slide/core; see the tracking issue for the MP4 half.
name: Docs Deck

on:
  push:
    branches:
      - main
    paths:
      - "deck/**"
      - ".github/workflows/docs-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deck
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish deck export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deck/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both the export and its check drive a real browser, so one has to be
      # present. --with-deps pulls the shared libraries the bare runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Not shipped. The exporter bundles same-origin assets into a zip when it
      # finds any, so it only yields a single openable file when driven from a
      # build whose fonts are already inlined.
      - name: Build single-file deck
        run: npm run build:single

      # open-slide offers this export only through its UI, so the script drives
      # the browser that is already installed.
      - name: Export standalone HTML
        run: npm run export:html

      # A deck that captured nothing still exports cleanly and exits 0. Opening
      # the artifact is the only check that tells the difference.
      - name: Verify the export opens
        run: npm run check:export

      - name: Publish to docs/deck
        run: cp html-export/checkpoint-distill.html ../docs/deck/checkpoint-distill.html

      - name: Commit if changed
        working-directory: .
        run: |
          if git diff --quiet -- docs/deck/; then
            echo "docs/deck/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deck/checkpoint-distill.html
          git commit -m "docs(deck): rebuild the deck export from deck source"
          git push
