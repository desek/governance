# Copyright Daniel Grenemark 2026
#
# Checks that the committed deck export matches a fresh build of the deck source.
#
# The export is committed by the author alongside the deck change it belongs to,
# and this workflow fails the pull request when the two have drifted. It does not
# rebuild the export on main.
#
# WHY THE CHECK RATHER THAN AN AUTOMATED COMMIT. This job used to rebuild the
# export on main and push the result. It cannot: the default branch ruleset
# requires every change to arrive through a pull request, and the Actions token
# has no bypass for that rule. A user-owned repository cannot grant one either,
# because the bypass list offers repository roles, deploy keys, and installed
# GitHub Apps, and the Actions token is none of those. The push was therefore
# rejected with GH013 and the export silently stayed stale on main. Checking
# freshness in the pull request keeps the export current without a credential
# that can write to the default branch.
#
# Only the HTML half is checked. The video under docs/deck/ is still captured
# by hand, because `open-slide video` is not in any published release of
# @open-slide/core; see the tracking issue for the MP4 half.
name: Docs Deck

on:
  pull_request:
    paths:
      - "deck/**"
      - "docs/deck/**"
      - ".github/workflows/docs-deck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the deck export is current
    # Pinned rather than ubuntu-latest: the pinned playwright-chromium ships no
    # Chromium build for Ubuntu 26.04, so npm ci fails there before the export
    # runs. Move this forward together with the playwright-chromium version.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deck/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both the export and its check drive a real browser, so one has to be
      # present. --with-deps pulls the shared libraries the bare runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Not shipped. The exporter bundles same-origin assets into a zip when it
      # finds any, so it only yields a single openable file when driven from a
      # build whose fonts are already inlined.
      - name: Build single-file deck
        run: npm run build:single

      # open-slide offers this export only through its UI, so the script drives
      # the browser that is already installed. A deck that captured nothing
      # still exports cleanly and exits 0, so each export is also opened.
      #
      # DECKS is the one list of decks this workflow checks. The failure
      # message carries the fix, because the reader of a red check is the party
      # who has to repair it and should not have to reconstruct the command
      # from the workflow file.
      - name: Export, verify, and compare every deck
        working-directory: .
        env:
          DECKS: checkpoint-distill iterate-reconcile
        run: |
          stale=0
          for deck in $DECKS; do
            (cd deck && node export.html.mjs --slide "$deck" && node check.export.mjs "html-export/$deck.html") || exit 1
            if diff -q "deck/html-export/$deck.html" "docs/deck/$deck.html" > /dev/null; then
              echo "docs/deck/$deck.html matches the deck source"
              continue
            fi
            stale=1
            echo "::error::The committed deck export is stale: docs/deck/$deck.html does not match a fresh build of deck/."
            echo ""
            echo "Rebuild it and commit the result in this pull request:"
            echo ""
            echo "  cd deck"
            echo "  npm ci"
            echo "  npx playwright install chromium"
            echo "  npm run build:single && node export.html.mjs --slide $deck && node check.export.mjs html-export/$deck.html"
            echo "  cp html-export/$deck.html ../docs/deck/$deck.html"
            echo ""
            echo "Then verify: this check passes, and the export opens in a browser."
          done
          exit $stale
